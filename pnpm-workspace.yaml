packages:
  - "apps/*"
  - "packages/*"

# One version for every dependency that two or more packages use. Packages list
# them as "catalog:" and the range is set here, so the apps can't drift apart.
# A dependency only one package uses keeps its own range in that package.json.
# @types/react and @playwright/test must stay on one version (.agents/knowledge.md).
catalog:
  # Framework
  next: 16.3.8
  react: 19.2.8
  react-dom: 19.2.8

  # UI
  "@base-ui/react": ^1.8.0
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  lucide-react: ^1.61.0
  server-only: ^0.0.1
  shadcn: ^4.21.3
  tailwindcss: ^4.3.3
  "@tailwindcss/postcss": ^4
  tw-animate-css: ^1.4.0
  zod: ^4.6.5

  # Cloudflare
  "@opennextjs/cloudflare": ^1.20.10
  wrangler: ^4.149.0

  # Types and linting
  typescript: ^5
  "@types/node": ^20
  "@types/react": ^19
  "@types/react-dom": ^19
  eslint: ^9
  eslint-config-next: 16.3.8

  # Tests
  vitest: ^4.1.10
  "@vitejs/plugin-react": ^6.0.5
  happy-dom: ^20.11.2
  "@testing-library/dom": ^10.4.1
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.2
  "@playwright/test": 1.64.1

# `pnpm add <pkg>` writes "catalog:" when the package is in the catalog.
catalogMode: prefer

# pnpm 10 skips dependency install scripts unless they are approved here.
# worker (wrangler runtime) and esbuild download native binaries;
# unrs-resolver is the native resolver used by eslint-config-next.
onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - workerd

# sharp (optional Next.js image dependency) stays unbuilt, as react-handbook
# had it before it joined the workspace.
ignoredBuiltDependencies:
  - sharp
